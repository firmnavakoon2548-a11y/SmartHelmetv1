<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#08101E" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Shield & Eye Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Radar Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Container Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Background Radar Grid Waves -->
  <circle cx="256" cy="240" r="180" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="240" r="140" fill="none" stroke="#14b8a6" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="256" cy="240" r="95" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-opacity="0.25" />

  <!-- Protective Shield Crest Shape -->
  <path d="M 256 95
           C 335 95 385 118 405 140
           C 405 260 350 365 256 415
           C 162 365 107 260 107 140
           C 127 118 177 95 256 95 Z"
        fill="#041322"
        fill-opacity="0.85"
        stroke="url(#primaryGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Helmet / Visor Shape with Sleek Curves -->
  <path d="M 160 190
           C 160 150 200 135 256 135
           C 312 135 352 150 352 190
           C 352 230 320 280 256 315
           C 192 280 160 230 160 190 Z"
        fill="none"
        stroke="url(#primaryGrad)"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.5" />

  <!-- Smart Vision Eye Iris & Sonar Center Core -->
  <circle cx="256" cy="235" r="54" fill="#031F2D" stroke="#06B6D4" stroke-width="6" />
  <circle cx="256" cy="235" r="36" fill="url(#primaryGrad)" filter="url(#glow)" />
  <circle cx="256" cy="235" r="18" fill="#FFFFFF" />

  <!-- Forward Sonar Beams / Navigation Rays (Top Arcs) -->
  <path d="M 215 155 A 58 58 0 0 1 297 155" fill="none" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 190 125 A 95 95 0 0 1 322 125" fill="none" stroke="#2DD4BF" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />

  <!-- Smart Connection Spark Nodes -->
  <circle cx="256" cy="72" r="7" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="107" cy="140" r="5" fill="#14B8A6" />
  <circle cx="405" cy="140" r="5" fill="#14B8A6" />
  <circle cx="256" cy="415" r="7" fill="#06B6D4" filter="url(#glow)" />

  <!-- Bottom Brand Text (SAFESIGHT) -->
  <text x="256" y="472"
        text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="900"
        font-size="34"
        letter-spacing="5"
        fill="#F8FAFC">
    SAFE<tspan fill="#2DD4BF">SIGHT</tspan>
  </text>
</svg>
